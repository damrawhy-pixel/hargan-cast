name: Release

# Pushing a tag such as v0.3.0 builds every platform and opens a draft GitHub
# release with the files; publishing that draft is what desktop copies update
# from. Running it by hand builds the same files without a release.
#
# Signing comes from repository secrets and is skipped while they are missing:
#   Android  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   iOS      ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (TestFlight upload)
#   Windows  AZURE_* (Trusted Signing)
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Version from the tag, or from package.json
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="$(node -p "require('./package.json').version")"; fi
          # Store build numbers must only grow: MMM mm pp rr, where rr is a
          # pre-release's number (1-98) and 99 for the final release, so
          # 0.3.0-beta.2 (30002) sorts before 0.3.0 (30099).
          IFS=. read -r major minor patch <<< "${name%%-*}"
          pre=99
          if [[ "$name" == *-* ]]; then
            pre="$(grep -oE '[0-9]+$' <<< "$name" || echo 1)"
            (( pre > 98 )) && pre=0
          fi
          if (( minor > 99 || patch > 99 || pre < 1 || major > 2000 )); then
            echo "::error::$name does not fit the build number scheme (minor and patch up to 99, pre-release number 1-98)"
            exit 1
          fi
          code=$((major * 1000000 + minor * 10000 + patch * 100 + pre))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Hargan Cast $name (build $code)"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A release is only built from code that passes the same checks as CI.
      - name: Types, lint and unit tests
        run: npm run check
      - name: Toolchain for the PlayStation core
        shell: pwsh
        run: |
          $v = '20260616'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath C:\llvm-mingw
          "C:\llvm-mingw\llvm-mingw-$v-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          choco install ninja --no-progress -y
      - name: PlayStation core
        run: npm run native
      - name: DualSense format tests
        run: npm run test:native
      # Signed through Azure Trusted Signing once its secrets exist (docs/RELEASING.md);
      # until then the installer is built unsigned, as before.
      - name: Installer
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.name }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          npx electron-vite build
          args=(--win nsis --publish never "-c.extraMetadata.version=$VERSION")
          if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$SIGN_ENDPOINT" ]; then
            echo "Signing with Azure Trusted Signing as $SIGN_PUBLISHER"
            args+=(
              "-c.win.signAndEditExecutable=true"
              "-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE"
              "-c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER"
            )
          else
            echo "::warning::Azure Trusted Signing secrets are missing; the installer is unsigned"
          fi
          npx electron-builder "${args[@]}"
      # electron-builder also signs the executables under resources, the PlayStation
      # core among them; the installer, the app and the core must all be signed.
      - name: Check the signatures
        if: env.SIGNED != ''
        shell: pwsh
        env:
          SIGNED: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $files = @(Get-ChildItem dist/*.exe | Select-Object -First 1) + @(Get-Item 'dist/win-unpacked/Hargan Cast.exe', 'dist/win-unpacked/resources/hargan-ps-core.exe')
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            "$($file.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($file.Name) is not validly signed" }
          }
      # The npm side of what ships. The native core's sources (Chiaki, jerasure,
      # gf-complete, nanopb and what CMake fetches) are listed in NOTICE.md.
      - name: Software bill of materials
        shell: bash
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file "dist/HarganCast-${{ needs.version.outputs.name }}-sbom.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/beta.yml
            dist/alpha.yml
            dist/*-sbom.cdx.json

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HC_VERSION_NAME: ${{ needs.version.outputs.name }}
      HC_VERSION_CODE: ${{ needs.version.outputs.code }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap sync android
      - name: Upload key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
      - name: Signed bundle and APK for Google Play
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      # Without the key there is nothing Google Play would take; an installable test build instead.
      - name: Test build (no upload key yet)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect
        run: |
          mkdir out
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab "out/HarganCast-$HC_VERSION_NAME.aab"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/HarganCast-$HC_VERSION_NAME.apk"
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/HarganCast-$HC_VERSION_NAME-test.apk"
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*

  ios:
    needs: version
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HC_VERSION_NAME: ${{ needs.version.outputs.name }}
      HC_VERSION_CODE: ${{ needs.version.outputs.code }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: PlayStation core
        run: bash mobile/plugins/ps-core/ios/build-core.sh
      # Always: an unsigned app that AltStore or Sideloadly can sign with any Apple ID.
      - name: Unsigned build
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$HC_VERSION_NAME" CURRENT_PROJECT_VERSION="$HC_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "out/HarganCast-$HC_VERSION_NAME-unsigned.ipa" Payload
      # Once an App Store Connect API key is in the secrets: sign through Apple and
      # upload to TestFlight. Xcode creates the certificate and profile itself.
      - name: App Store build to TestFlight
        if: env.ASC_KEY_ID != '' && startsWith(github.ref, 'refs/tags/v')
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$HC_VERSION_NAME" CURRENT_PROJECT_VERSION="$HC_VERSION_CODE" "${auth[@]}"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath build/export "${auth[@]}"
          rm -f "$key"
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      # Lets anyone check a file was built here from the tagged commit:
      #   gh attestation verify <file> --repo damrawhy-pixel/hargan-cast
      # The update feeds (*.yml) are left out: rollout.yml edits them later.
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.exe
            out/*.apk
            out/*.aab
            out/*.ipa
            out/*.json
      # The repository variable ROLLOUT_PERCENT (1-99) sends a new desktop version
      # to only that share of installs at first; raise it with rollout.yml.
      # Unset means everyone. A tag with a pre-release part (v0.4.0-beta.1)
      # becomes a GitHub pre-release, which only the beta channel installs.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLOUT_PERCENT: ${{ vars.ROLLOUT_PERCENT }}
        run: |
          if [[ "$ROLLOUT_PERCENT" =~ ^[0-9]+$ ]] && (( ROLLOUT_PERCENT > 0 && ROLLOUT_PERCENT < 100 )); then
            for feed in out/latest.yml out/beta.yml; do
              [ -f "$feed" ] && echo "stagingPercentage: $ROLLOUT_PERCENT" >> "$feed"
            done
            echo "Staged rollout: $ROLLOUT_PERCENT%"
          fi
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" \
            --title "Hargan Cast ${{ needs.version.outputs.name }}" --generate-notes
