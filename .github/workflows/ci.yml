name: CI

# Every push and pull request: types, lint, unit tests and the bundles build;
# on Windows the PlayStation core builds and its DualSense format tests run.
# Release builds (release.yml) and phone builds (mobile.yml) stay separate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    env:
      # Nothing here launches the desktop shell.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Desktop and phone bundles build
        run: |
          npx electron-vite build
          npm run build:mobile

  native:
    name: PlayStation core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Toolchain
        shell: pwsh
        run: |
          $v = '20260616'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath C:\llvm-mingw
          "C:\llvm-mingw\llvm-mingw-$v-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          choco install ninja --no-progress -y
      - name: Build the core
        run: node scripts/build-native.mjs
      - name: DualSense format tests
        run: node scripts/build-native.mjs --test

  ui:
    name: Interface tests (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The media test replays a clip through the diagnostic build of the PS core.
      - name: Toolchain for the PlayStation core
        shell: pwsh
        run: |
          $v = '20260616'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP/llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP/llvm-mingw.zip" -DestinationPath C:/llvm-mingw
          "C:/llvm-mingw/llvm-mingw-$v-ucrt-x86_64/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          choco install ninja --no-progress -y
      - name: Diagnostic PlayStation core
        run: |
          node scripts/build-native.mjs
          cmake --build native/build --target hargan-ps-core-diag
      - run: npx electron-vite build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 14

  fuzz:
    name: Fuzz the core's input parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with libFuzzer, ASan and UBSan
        working-directory: native/ps-core
        run: |
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -Isrc -I../third_party/chiaki/include \
            fuzz/fuzz_reports.c src/controller_io.c src/dualsense_report.c ../third_party/chiaki/src/controller.c \
            -o fuzz_reports -lm
      - name: Fuzz for two minutes
        working-directory: native/ps-core
        run: |
          mkdir -p corpus
          ./fuzz_reports corpus -max_total_time=120 -max_len=512
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash
          path: native/ps-core/crash-*
