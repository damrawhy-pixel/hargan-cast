name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mobile/**'
      - 'native/ps-core/**'
      - 'native/third_party/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.mobile.config.ts'
      - 'tsconfig.mobile.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

env:
  # The desktop shell's binary is not needed to build the phone apps.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck the interface and the phone bridge
        run: |
          npx tsc -p tsconfig.web.json
          npx tsc -p tsconfig.mobile.json
      - run: npm run build:mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap sync android
      # Also builds the PlayStation core (native/ps-core/mobile) with the runner's NDK.
      - name: Build
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: HarganCast-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  # The APK on an Android emulator, driven through its WebView by Playwright
  # (tests/android). KVM makes the x86_64 emulator fast on Linux runners.
  android-test:
    name: Android on an emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: HarganCast-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app-debug.apk
            mkdir -p test-results/android
            npx playwright test -c playwright.android.config.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-test-results
          path: test-results/
          if-no-files-found: ignore

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build the PlayStation core
        run: bash mobile/plugins/ps-core/ios/build-core.sh
      # Unsigned until an Apple developer account is connected; it can be sideloaded
      # with AltStore or Sideloadly, which sign it with the user's own Apple ID.
      - name: Build
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry HarganCast-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: HarganCast-ios
          path: HarganCast-unsigned.ipa
